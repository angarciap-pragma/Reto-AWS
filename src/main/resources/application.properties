spring.application.name=practice
server.port=8081
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%-5level) [%X{traceId:-}] %clr(%logger{36}){cyan} - %msg%n
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.datasource.url=${DB_URL:jdbc:h2:mem:practice;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

app.api.paths.base-path=/api/v1/personas
app.api.paths.save-person=/guardarpersona
app.api.paths.find-person=/consultarpersona/{identificationNumber}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.api.errors.unexpected-code=UNEXPECTED_ERROR
app.api.errors.unexpected-message=Ocurrio un error inesperado
app.api.errors.validation-code=VALIDATION_ERROR
app.api.errors.validation-message=Error de validacion
app.api.errors.not-found-code=ROUTE_NOT_FOUND
app.api.errors.not-found-message=La ruta solicitada no existe
app.api.errors.method-not-allowed-code=METHOD_NOT_ALLOWED
app.api.errors.method-not-allowed-message=El metodo HTTP no esta permitido para esta ruta
app.api.errors.unsupported-media-type-code=UNSUPPORTED_MEDIA_TYPE
app.api.errors.unsupported-media-type-message=El tipo de contenido enviado no es soportado
app.api.errors.not-acceptable-code=NOT_ACCEPTABLE
app.api.errors.not-acceptable-message=El formato de respuesta solicitado no es soportado

app.person.messages.already-exists=La persona ya existe
app.person.messages.not-found=La persona no existe

person.identification.required=El numero de identificacion es obligatorio
person.identification.size=El numero de identificacion no puede superar 30 caracteres
person.name.required=El nombre es obligatorio
person.name.size=El nombre no puede superar 120 caracteres
person.email.required=El email es obligatorio
person.email.format=El email no tiene un formato valido
